<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fluffy-engine login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 420px; }
    form { display: grid; gap: 0.75rem; }
    input, button { padding: 0.6rem; font-size: 1rem; }
    .error { color: #b00020; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Live Bank Dashboard (Sandbox)</h1>
  <p>This demo uses Plaid sandbox/dev mode and is not production-hardened.</p>
  <form id="login-form">
    <label>Username <input type="text" name="username" required></label>
    <label>Password <input type="password" name="password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="error" id="error"></p>
  <script>
    const form = document.getElementById("login-form");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const data = new FormData(form);
      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
          username: data.get("username"),
          password: data.get("password"),
        }),
      });
      if (!response.ok) {
        error.textContent = "Login failed. Check your credentials.";
        return;
      }
      window.location.assign("/dashboard");
    });
  </script>
</body>
</html>
