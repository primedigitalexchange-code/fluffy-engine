name: Security

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bandit security scan
        run: bandit -r . -x tests -ll -ii

      - name: Scan for hardcoded secrets with detect-secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^\.secrets\.baseline$|.*\.pytest_cache/.*)' > .secrets.current.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          def fingerprints(results: dict[str, list[dict[str, object]]]) -> set[tuple[str, str, str]]:
              items: set[tuple[str, str, str]] = set()
              for file_path, findings in results.items():
                  normalized = str(Path(file_path))
                  for finding in findings:
                      items.add(
                          (
                              normalized,
                              str(finding.get("type", "")),
                              str(finding.get("hashed_secret", "")),
                          )
                      )
              return items

          with open(".secrets.baseline", "r", encoding="utf-8") as baseline_fh:
              baseline = json.load(baseline_fh)

          with open(".secrets.current.json", "r", encoding="utf-8") as current_fh:
              current = json.load(current_fh)

          baseline_findings = fingerprints(baseline.get("results", {}))
          current_findings = fingerprints(current.get("results", {}))
          new_findings = sorted(current_findings - baseline_findings)

          if new_findings:
              print("New potential hardcoded secrets detected:")
              for file_path, finding_type, hashed_secret in new_findings:
                  print(f"- {file_path}: {finding_type} ({hashed_secret})")
              sys.exit(1)

          print("No new hardcoded secrets detected.")
          PY
